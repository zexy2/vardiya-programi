<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect fill="url(#bg-gradient)" width="512" height="512" rx="64"/>
  <!-- Clipboard Icon -->
  <g transform="translate(128, 80)">
    <!-- Clipboard Board -->
    <rect x="0" y="40" width="256" height="320" rx="16" fill="white"/>
    <!-- Clipboard Clip -->
    <rect x="80" y="20" width="96" height="60" rx="8" fill="#1e293b"/>
    <circle cx="128" cy="50" r="12" fill="white"/>
    <!-- Lines -->
    <rect x="40" y="120" width="176" height="16" rx="4" fill="#e2e8f0"/>
    <rect x="40" y="160" width="140" height="16" rx="4" fill="#e2e8f0"/>
    <rect x="40" y="200" width="176" height="16" rx="4" fill="#e2e8f0"/>
    <rect x="40" y="240" width="120" height="16" rx="4" fill="#e2e8f0"/>
    <!-- Checkmark Circle -->
    <circle cx="200" cy="300" r="40" fill="#10b981"/>
    <path d="M180 300 L195 315 L220 285" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
